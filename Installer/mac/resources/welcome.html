<h2 style="margin-bottom:4px">AI Cleaner</h2>
<p>Cleans the artifacts of AI-generated stems (Suno and others): metallic highs, harsh S sounds, resonances, mud, bleed, reverb, phasey stereo and soft transients.</p>
<p>This installs the <b>VST3</b> and <b>Audio Unit</b> versions in your system plug-in folders.</p>
